// SMART DECODER — descompone CUALQUIER palabra médica
// ══════════════════════════════════════════════════════════════
function normalize(s){
  return s.toLowerCase().replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i").replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n").replace(/[^a-z]/g,"");
}
function cleanPart(tx){
  return normalize(tx.replace(/^-/,"").replace(/-$/,""));
}
function decomposeWord(input){
  var word=normalize(input);
  if(!word||word.length<3)return null;
  // Build a list of all matchable pieces (prefixes, suffixes, roots)
  // Strategy: greedy longest-match from left to right, then try to cover the rest.
  var pieces=[];
  VOC.forEach(function(v){
    // handle compound entries like "cole- / colecisto-"
    var variants=v.tx.split("/").map(function(x){return cleanPart(x.trim())});
    variants.forEach(function(p){
      if(p.length>=2)pieces.push({p:p,v:v,t:v.t});
    });
  });
  // Dedupe and sort by length desc
  var seen={};
  pieces=pieces.filter(function(x){
    if(seen[x.p])return false;
    seen[x.p]=true;
    return true;
  }).sort(function(a,b){return b.p.length-a.p.length});
  // Greedy scan
  var result=[];
  var pos=0;
  var remaining=word;
  var safety=0;
  while(remaining.length>0 && safety<40){
    safety++;
    var matched=null;
    for(var i=0;i<pieces.length;i++){
      if(remaining.indexOf(pieces[i].p)===0){
        matched=pieces[i];
        break;
      }
    }
    if(matched){
      result.push({piece:matched.p,voc:matched.v,start:pos});
      remaining=remaining.slice(matched.p.length);
      pos+=matched.p.length;
    } else {
      // shift 1 char and continue searching (gap = connector like 'o')
      remaining=remaining.slice(1);
      pos++;
    }
  }
  return result;
}

// PALABRA DEL DÍA — rotación automática por hash de fecha
// ══════════════════════════════════════════════════════════════
function wordOfTheDay(){
  var d=new Date();
  // Deterministic hash from YYYY-MM-DD that changes each day
  var seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  // Mix with a prime to spread the distribution across the VOC array
  var idx=(seed*2654435761)%VOC.length;
  if(idx<0)idx+=VOC.length;
  return VOC[idx];
}

            flex:"0 0 auto",
            padding:"9px 14px",
            background:view===t.k?"linear-gradient(135deg,#3b82f6,#a78bfa)":"rgba(13,18,36,.6)",
            border:"1px solid "+(view===t.k?"transparent":C.bd),
            borderRadius:"11px",
            color:view===t.k?"#fff":C.mt,
            fontSize:"12px",
            fontWeight:700,
            cursor:"pointer",
            whiteSpace:"nowrap"
          }
        },t.l);
      })
    ),
    view==="dec" && e(F,null,
      e(SmartDecoder,{v:dec,set:setDec}),
      !dec && e("div",{style:{padding:"0 20px"}},
        e("div",{style:{padding:"16px",background:"rgba(13,18,36,.5)",border:"1px solid "+C.bd,borderRadius:"14px",fontSize:"13px",color:C.mt,lineHeight:1.6}},
          e("div",{style:{fontSize:"11px",color:"#60a5fa",fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:"10px"}},"◆ Cómo funciona"),
          e("div",{style:{color:C.tx,marginBottom:"6px"}},"El decoder parte cualquier palabra médica en sus raíces reconocidas:"),
          e("div",{style:{fontSize:"12px",marginTop:"6px",padding:"8px 10px",background:"rgba(6,10,20,.4)",borderRadius:"8px"}},"Ejemplo: ",e("span",{style:{color:"#60a5fa",fontFamily:"'JetBrains Mono',monospace"}},"pielonefritis")," → ",e("strong",{style:{color:"#34d399"}},"pielo")," + ",e("strong",{style:{color:"#fb7185"}},"nefr")," + ",e("strong",{style:{color:"#a78bfa"}},"itis")),
          e("div",{style:{fontSize:"12px",marginTop:"6px",padding:"8px 10px",background:"rgba(6,10,20,.4)",borderRadius:"8px"}},"Ejemplo: ",e("span",{style:{color:"#60a5fa",fontFamily:"'JetBrains Mono',monospace"}},"hepatoesplenomegalia")," → ",e("strong",{style:{color:"#fb7185"}},"hepato")," + ",e("strong",{style:{color:"#fb7185"}},"esplen")," + ",e("strong",{style:{color:"#fbbf24"}},"megalia")),
          e("div",{style:{marginTop:"12px",color:C.tx,fontStyle:"italic",fontSize:"12px"}},"Prueba: neumonía · taquicardia · osteoporosis · leucocitosis · broncoespasmo")
        )
      )
    ),
    view==="ex" && e("div",{style:{padding:"0 20px"}},
      e("div",{style:{fontSize:"10px",color:C.dm,letterSpacing:"2px",textTransform:"uppercase",fontWeight:700,marginBottom:"12px"}},"◆ "+DEMOS.length+" palabras descompuestas"),
      e("div",{style:{display:"flex",flexDirection:"column",gap:"10px"}},
        DEMOS.map(function(d,i){return e(DemoCard,{key:d.id,d:d})})
      )
    ),
    view==="qz" && e("div",{style:{padding:"0 20px"}},e(Quiz,{seed:qSeed,restart:function(){setQSeed(qSeed+1)}})),
    view==="lib" && e(F,null,
      e(WordOfDay,null),
      e("div",{style:{padding:"0 20px 14px"}},
        e("input",{
          type:"text",
          value:search,
          onChange:function(ev){setSearch(ev.target.value)},
          placeholder:"🔍 Buscar en "+VOC.length+" términos...",
          style:{width:"100%",padding:"13px 16px",background:"rgba(13,18,36,.7)",border:"1px solid "+C.bd,borderRadius:"12px",color:C.tx,fontSize:"14px"}
        })
      ),
      e("div",{style:{padding:"0 20px 10px",display:"flex",gap:"6px"}},
        [{k:"all",l:"Todos",c:"#60a5fa"},{k:"p",l:"Prefijos",c:"#fbbf24"},{k:"s",l:"Sufijos",c:"#60a5fa"},{k:"w",l:"Términos",c:"#e879f9"}].map(function(t){
          return e("button",{
            key:t.k,
            onClick:function(){setTipo(t.k)},
            style:{
              flex:1,
              padding:"8px",
              background:tipo===t.k?t.c+"22":"transparent",
              border:"1px solid "+(tipo===t.k?t.c+"66":C.bd),
              borderRadius:"10px",
              color:tipo===t.k?t.c:C.mt,
              fontSize:"11px",
              fontWeight:700,
              cursor:"pointer"
            }
          },t.l);
        })
      ),
      e("div",{style:{padding:"0 20px 16px"}},
        e("div",{style:{fontSize:"10px",color:C.dm,letterSpacing:"2px",textTransform:"uppercase",fontWeight:700,marginBottom:"10px"}},"◆ Categorías ("+CATS.length+")"),
        e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:"7px"}},
          e("div",{
            onClick:function(){setCat("all")},
            style:{
              padding:"14px 12px",
              background:cat==="all"?"linear-gradient(135deg,rgba(59,130,246,.15),rgba(167,139,250,.08))":"linear-gradient(135deg,rgba(13,18,36,.8),rgba(13,18,36,.4))",
              border:"1px solid "+(cat==="all"?"rgba(96,165,250,.6)":C.bd),
              borderRadius:"14px",
              cursor:"pointer"
            }
          },
            e("div",{style:{fontSize:"26px",marginBottom:"6px"}},"🌐"),
            e("div",{style:{fontSize:"12px",fontWeight:700,color:C.tx,marginBottom:"3px"}},"Todos"),
            e("div",{style:{fontSize:"10px",color:C.mt}},"Biblioteca completa"),
            e("div",{style:{marginTop:"7px",display:"inline-flex",padding:"2px 7px",background:"rgba(96,165,250,.2)",color:"#60a5fa",borderRadius:"5px",fontSize:"10px",fontWeight:700}},VOC.length)
          ),
          CATS.map(function(c){
            return e(CatCard,{key:c.id,c:c,cnt:counts[c.id],active:cat===c.id,onClick:function(){setCat(c.id)}});
          })
        )
      ),
      e("div",{style:{padding:"0 20px"}},
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}},
          e("div",{style:{fontSize:"10px",color:C.dm,letterSpacing:"2px",textTransform:"uppercase",fontWeight:700}},"◆ "+(cat==="all"?"Biblioteca":CATS.find(function(x){return x.id===cat}).n)),
          e("div",{style:{fontSize:"11px",color:C.mt}},filtered.length+" resultados")
        ),
        filtered.length===0
          ? e("div",{style:{padding:"40px 20px",textAlign:"center",color:C.mt,background:"rgba(13,18,36,.4)",borderRadius:"16px",border:"1px dashed "+C.bd}},
              e("div",{style:{fontSize:"40px",marginBottom:"10px"}},"🔍"),
              e("div",null,"Sin coincidencias")
            )
          : e("div",{style:{display:"flex",flexDirection:"column",gap:"7px"}},
              filtered.map(function(x,i){
                var cobj=CATS.find(function(c){return c.id===x.cat});
                var k=x.cat+"_"+x.tx+"_"+i;
                return e(TermCard,{key:k,x:x,cat:cobj,open:!!open[k],toggle:function(){toggleItem(k)}});
              })
            )
      ),
      e("div",{style:{margin:"40px 20px 0",padding:"24px 20px",background:"linear-gradient(135deg,rgba(96,165,250,.08),rgba(167,139,250,.08))",border:"1px solid "+C.bd,borderRadius:"18px",textAlign:"center"}},
        e("div",{style:{fontSize:"28px",marginBottom:"10px"}},"🏛️"),
        e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:"18px",color:C.tx,fontWeight:700,marginBottom:"4px"}},"El Conocimiento Es Para Todos"),
        e("div",{style:{fontSize:"12px",color:C.mt,lineHeight:1.5,fontStyle:"italic"}},"La etimología médica es la llave maestra.",e("br",null),"Cada palabra es un mapa de significado."),
        e("div",{style:{marginTop:"14px",fontSize:"10px",color:C.dm,letterSpacing:"1.5px"}},"ECEPT · v3.0 · "+VOC.length+" raíces · "+DEMOS.length+" demos")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
