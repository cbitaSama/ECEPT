<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a14" />
    <meta name="description" content="ECEPT — El Conocimiento Es Para Todos. Plataforma de estudio médica en español." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ECEPT — El Conocimiento Es Para Todos</title>

    <!-- Critical CSS — evita flash blanco antes de que cargue React -->
    <style>
      html, body { background: #060a14; color: #e2e8f0; margin: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #0a0e1f 0%, #060a14 100%);
      }
      .boot-loader__pulse {
        width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
        animation: bootPulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(0.85); opacity: 0.6; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-hidden="true">
        <div class="boot-loader__pulse"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
