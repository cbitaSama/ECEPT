{cat:"term",t:"w",tx:"Remisión",or:"Latín: remittere",sig:"Desaparición parcial o total de manifestaciones sin necesariamente curar.",ej:["Remisión completa → sin rastro","Remisión parcial → ↓50%","Remisión molecular"],tip:"Tregua."},
{cat:"term",t:"w",tx:"Incidencia vs Prevalencia",or:"Epidemiología",sig:"Incidencia: casos NUEVOS en período. Prevalencia: TOTAL en momento.",ej:["Incidencia → dinámico","Prevalencia → fotografía","Letalidad → % que mueren"],tip:"Nuevos vs total."},

{cat:"term",t:"w",tx:"Autólogo vs Alogénico vs Xenogénico",or:"Griego: autós / állos / xénos",sig:"Autólogo: del mismo paciente. Alogénico: de otro humano. Xenogénico: de otra especie.",ej:["Autotransplante óseo","Trasplante alogénico de MO","Válvula xenogénica (porcina)"],tip:"Uno mismo / otro humano / animal."},

function initCranialMap() {
var MAP_NERVES={};NERVES.forEach(function(n){var TC={"Sensitivo":"#34d399","Motor":"#60a5fa","Mixto":"#a78bfa"};MAP_NERVES[n.id]={name:n.name.replace(/^Nervio /,"").replace(/ \(.+\)$/,""),roman:n.id,type:n.tipos[0],color:TC[n.tipos[0]]||"#94a3b8",apparent:n.origen_aparente,real:n.real,func:n.funcion};});
var TYPE_BG = {
"Motor":"rgba(96,165,250,0.15)",
"Sensitivo":"rgba(52,211,153,0.15)",
"Mixto":"rgba(167,139,250,0.15)"
};
var root = document.getElementById('ecm');
var mount = document.getElementById('ecm-pnl-mount');
var activeId = null;
function getNerveGroups(){
return root.querySelectorAll('.ecm-n');
}
function clearActive(){
activeId = null;
var groups = getNerveGroups();
for (var i=0; i<groups.length; i++){
var g = groups[i];
var lines = g.querySelectorAll('.ecm-nl');
var labels = g.querySelectorAll('.ecm-la, .ecm-lb, .ecm-ld');
for (var j=0; j<lines.length; j++){
lines[j].classList.remove('dim');
lines[j].classList.remove('active');
}
for (var k=0; k<labels.length; k++){
labels[k].classList.remove('dim');
labels[k].classList.remove('active');
}
}
mount.innerHTML = '';
}
function setActive(id){
if (activeId === id){
clearActive();
return;
}
activeId = id;
var groups = getNerveGroups();
for (var i=0; i<groups.length; i++){
var g = groups[i];
var isActive = g.getAttribute('data-nerve') === id;
var lines = g.querySelectorAll('.ecm-nl');
var labels = g.querySelectorAll('.ecm-la, .ecm-lb, .ecm-ld');
for (var j=0; j<lines.length; j++){
if (isActive){
lines[j].classList.add('active');
lines[j].classList.remove('dim');
} else {
lines[j].classList.add('dim');
lines[j].classList.remove('active');
}
}
for (var k=0; k<labels.length; k++){
if (isActive){
labels[k].classList.add('active');
labels[k].classList.remove('dim');
} else {
labels[k].classList.add('dim');
labels[k].classList.remove('active');
}
}
}
renderPanel(id);
}
function escapeHtml(s){
return String(s).replace(/[&<>"']/g, function(c){
return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
});
}
function renderPanel(id){
var n = MAP_NERVES[id];
if (!n) return;
var html = '' +
'<div class="ecm-pnl">' +
'<div class="ecm-ph">' +
'<div>' +
'<h4 class="ecm-pn">' +
'<span class="ecm-prm" style="background:' + n.color + '22;color:' + n.color + '">' + n.roman + '</span>' +
escapeHtml(n.name) +
'</h4>' +
'<span class="ecm-pt" style="background:' + TYPE_BG[n.type] + ';color:' + n.color + '">' + n.type + '</span>' +
'</div>' +
'<button class="ecm-cl" aria-label="Cerrar" type="button">×</button>' +
'</div>' +
'<div class="ecm-rw"><div class="ecm-rla">Origen aparente</div><div class="ecm-rv">' + escapeHtml(n.apparent) + '</div></div>' +
'<div class="ecm-rw"><div class="ecm-rla">Origen real</div><div class="ecm-rv">' + escapeHtml(n.real) + '</div></div>' +
'<div class="ecm-fn"><strong>⚡ Función:</strong> ' + escapeHtml(n.func) + '</div>' +
'</div>';
mount.innerHTML = html;
var btn = mount.querySelector('.ecm-cl');
if (btn) btn.addEventListener('click', clearActive);
try { mount.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(e){}
}
function attachHandlers(){
var groups = getNerveGroups();
for (var i=0; i<groups.length; i++){
(function(g){
var id = g.getAttribute('data-nerve');
g.addEventListener('click', function(){ setActive(id); });
g.addEventListener('touchstart', function(e){}, {passive:true});
})(groups[i]);
}
}
attachHandlers();
}function NervesMap() {
  useEffect(function() {
    var el = document.getElementById("ecm");
    if (!el) return;
    var timer = setTimeout(function() { initCranialMap(); }, 30);
    return function() {
      clearTimeout(timer);
      var mount = document.getElementById("ecm-pnl-mount");
      if (mount) mount.innerHTML = "";
    };
  }, []);

  return e("div", {id: "ecm", dangerouslySetInnerHTML: {__html: CRANIAL_MAP_HTML}});
}

  var qs=useState({}),quizAns=qs[0],setQuizAns=qs[1];
  var ss=useState(0),streak=ss[0],setStreak=ss[1];

  var currentRec=currentFamily.receptors[recIdx]||currentFamily.receptors[0];
  var currentQuiz=RECEPTOR_QUIZZES[family]||[];
  var currentPearls=RECEPTOR_PEARLS[family]||[];

  function changeFamily(id){
    setFamily(id);setRecIdx(0);setQuizAns({});setMainTab(0);
    try{window.scrollTo({top:0,behavior:'smooth'})}catch(err){}
  }

    if(quizAns[qi]!==undefined) return;
    var newAns={};
    for(var k in quizAns) newAns[k]=quizAns[k];
    newAns[qi]=oi;
    setQuizAns(newAns);
    if(oi===currentQuiz[qi].r){

  );

  var familySelector=e('div',{style:{marginBottom:'20px'}},
    e('div',{style:{fontSize:'11px',fontWeight:700,color:C.dm,textTransform:'uppercase',letterSpacing:'2px',marginBottom:'12px',paddingLeft:'4px'}},'📚 Elige una familia'),
    e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'10px'}},
      RECEPTOR_FAMILIES.map(function(fam){

          style:{

          }},
          e('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}},
            e('span',{style:{fontSize:'22px'}},fam.icon),

/* Small helper: returns React.createElement tree for a string-with-inline-HTML.
   dangerouslySetInnerHTML is OK here — content is static Spanish medical text
   authored by the app, not user input. Matches NervesMap.js precedent. */
function traumaHtml(tag, html, extraStyle, key) {
  var props = {dangerouslySetInnerHTML: {__html: html || ""}};
  if (extraStyle) props.style = extraStyle;
  if (key != null) props.key = key;
  return e(tag, props);
}

/* Attach inline-HTML anchor click handlers for linkbadge elements inside
   dangerouslySetInnerHTML blocks. Each render mounts one listener on the
   container div; delegation handles any .linkbadge inside. */
function traumaInstallLinkHandler(containerRef, onJump, onSecJump) {
  useEffect(function(){
    var node = containerRef.current;
    if (!node) return;
    function handler(ev) {
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains("linkbadge")) return;
      var jump = t.getAttribute("data-jump");
      var secJump = t.getAttribute("data-sec-jump");
      if (jump && onJump) { onJump(jump); ev.preventDefault(); }
      else if (secJump && onSecJump) { onSecJump(secJump); ev.preventDefault(); }
    }
    node.addEventListener("click", handler);
    return function(){ node.removeEventListener("click", handler); };
  }, [onJump, onSecJump]);
}

/* wordDecoder — morpheme-decomposition + date-deterministic word-of-day.
   Ported verbatim from artifacts/vocabulario_medico_v4.html (lines 660-729).
   Exposes 4 functions:
     vocabNormalize(s)         — accent-strip + lowercase + non-alpha drop
     vocabCleanPart(tx)        — normalize + strip leading/trailing hyphens
     vocabDecomposeWord(input) — greedy longest-match against VOCAB_VOC
     vocabWordOfDay()          — deterministic picker using today's date

   Names are prefixed with "vocab" to avoid collisions in the
   concatenated global-scope bundle (existing app already has search
   helpers, quiz helpers, etc.). */

function vocabNormalize(s) {
  return s.toLowerCase()
    .replace(/[áàä]/g, "a")
    .replace(/[éèë]/g, "e")
    .replace(/[íìï]/g, "i")
    .replace(/[óòö]/g, "o")
    .replace(/[úùü]/g, "u")
    .replace(/ñ/g, "n")
    .replace(/[^a-z]/g, "");
}

function vocabCleanPart(tx) {
  return vocabNormalize(tx.replace(/^-/, "").replace(/-$/, ""));
}

function vocabDecomposeWord(input) {
  var word = vocabNormalize(input);
  if (!word || word.length < 3) return null;

  /* Build list of all matchable pieces (prefixes, suffixes, roots) */
  var pieces = [];
  VOCAB_VOC.forEach(function(v) {
    /* Handle compound entries like "cole- / colecisto-" */
    var variants = v.tx.split("/").map(function(x) {
      return vocabCleanPart(x.trim());
    });
    variants.forEach(function(p) {
      if (p.length >= 2) pieces.push({p: p, v: v, t: v.t});
    });
  });

  /* Dedupe and sort by length desc (longest match first) */
  var seen = {};
  pieces = pieces.filter(function(x) {
    if (seen[x.p]) return false;
    seen[x.p] = true;
    return true;
  }).sort(function(a, b) { return b.p.length - a.p.length; });

  /* Greedy left-to-right scan */
  var result = [];
  var pos = 0;
  var remaining = word;
  var safety = 0;
  while (remaining.length > 0 && safety < 40) {
    safety++;
    var matched = null;
    for (var i = 0; i < pieces.length; i++) {
      if (remaining.indexOf(pieces[i].p) === 0) {
        matched = pieces[i];
        break;
      }
    }
    if (matched) {
      result.push({piece: matched.p, voc: matched.v, start: pos});
      remaining = remaining.slice(matched.p.length);
      pos += matched.p.length;
    } else {
      /* Shift 1 char and continue (gap = connector like 'o' / 'i') */
      remaining = remaining.slice(1);
      pos++;
    }
  }
  return result;
}

function vocabWordOfDay() {
  var d = new Date();
  /* Deterministic hash from YYYY-MM-DD; changes at local midnight */
  var seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  /* Mix with a prime (Knuth's multiplicative hash) to spread distribution */
  var idx = (seed * 2654435761) % VOCAB_VOC.length;
  if (idx < 0) idx += VOCAB_VOC.length;
  return VOCAB_VOC[idx];
}

   When expanded, cycles through morpheme steps every 1400 ms. */

function VocabDemoCard(props) {
  var d = props.d;
  var stepState = useState(0); var step = stepState[0], setStep = stepState[1];
  var expState  = useState(false); var exp = expState[0], setExp = expState[1];

  useEffect(function() {
    if (!exp) { setStep(0); return; }
    var max = d.p.length;
    var i = setInterval(function() {
      setStep(function(s){ return s >= max ? 0 : s + 1; });
    }, 1400);
    return function(){ clearInterval(i); };
  }, [exp, d.p.length]);

  return e("div", {
    style:{background:"linear-gradient(135deg, rgba(13,18,36,.95) 0%, rgba(13,18,36,.5) 100%)",
           border:"1px solid "+C.bd, borderRadius:"16px",
           overflow:"hidden", transition:"all .3s"}
  },
    e("div", {onClick: function(){ setExp(!exp); },
      style:{padding:"16px 18px", cursor:"pointer",
             display:"flex", alignItems:"center",
             justifyContent:"space-between", gap:"12px"}
    },
      e("div", {style:{flex:1, minWidth:0}},
        e("div", {style:{fontSize:"10px", color:"#60a5fa",
                         letterSpacing:"1.5px", textTransform:"uppercase",
                         fontWeight:700, marginBottom:"4px"}},
          exp ? "En vivo" : "Decodifica"),
        e("div", {style:{fontFamily:"'Playfair Display',serif",
                         fontSize:"18px", fontWeight:800, color:C.tx,
                         marginBottom:"2px", lineHeight:"1.2"}}, d.w),
        e("div", {style:{fontSize:"11px", color:C.mt, fontStyle:"italic"}}, d.sub)
      ),
      e("div", {style:{fontSize:"18px", color:"#60a5fa",
                       transform: exp ? "rotate(180deg)" : "rotate(0)",
                       transition:"transform .3s"}}, "▾")
    ),
    exp && e("div", {style:{padding:"0 18px 18px", animation:"fadeIn .4s",
                            borderTop:"1px solid "+C.bd}},
      (d.type === "neck" || d.type === "heart" || d.type === "abd")
        ? e("div", {style:{maxWidth:"260px", margin:"12px auto 0",
                           aspectRatio:"1/1"}},
            e(DemoSVG, {type: d.type, step: step, p: d.p}))
        : e(WordSVG, {step: step, p: d.p}),
      e("div", {style:{display:"grid",
                       gridTemplateColumns:"repeat("+d.p.length+",1fr)",
                       gap:"5px", marginTop:"10px", marginBottom:"10px"}},
        d.p.map(function(pt, i) {
          var act = step >= (i + 1);
          return e("div", {key:i, style:{
            padding:"8px 6px",
            background: act ? pt.c+"22" : "rgba(13,18,36,.4)",
            border: "1px solid " + (act ? pt.c+"66" : C.bd),
            borderRadius:"9px", textAlign:"center",
            transition:"all .5s", opacity: act ? 1 : .45
          }},
            e("div", {style:{fontFamily:"'JetBrains Mono',monospace",
                             fontSize:"10px", fontWeight:700,
                             color:pt.c, marginBottom:"1px"}}, pt.s),
            e("div", {style:{fontSize:"10px", color:C.tx, fontWeight:600}}, pt.m)
          );
        })
      ),
      e("div", {style:{padding:"10px 12px",
                       background:"rgba(52,211,153,.08)",
                       border:"1px solid rgba(52,211,153,.3)",
                       borderRadius:"10px", fontSize:"12px",
                       color:C.tx, lineHeight:"1.5"}}, "💡 " + d.rev)
    )
  );
}
