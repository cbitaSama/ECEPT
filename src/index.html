<script>
// Capturar errores globales en array para diagnóstico (NO reescribe el loader).
// El loader solo muestra error si el fail-safe (12s) se dispara.
window._ECEPT_ERRS = [];
window.addEventListener('error', function(ev) {
  try {
    var src = ev && ev.filename ? (ev.filename + '').split('/').pop() : '';
    var msg = (ev && ev.message ? ev.message : 'error') + (src ? ' @ ' + src + ':' + (ev.lineno || '?') : '');
    window._ECEPT_ERRS.push(msg);
  } catch(e2) {}
});
window.addEventListener('unhandledrejection', function(ev) {
  try {
    var r = ev && ev.reason;
    var msg = r && r.message ? r.message : (typeof r === 'string' ? r : 'unhandled promise');
    window._ECEPT_ERRS.push('promise: ' + msg);
  } catch(e2) {}
});
(function(){
  // Loader visible mínimo 1200ms desde primer paint (animation-delay CSS).
  // Cuando React monta, dispara ECEPT_READY → desactivamos pause + cancelamos fail-safe.
  // PATRÓN SIMPLE — sin listener error que reescriba loader (eso causaba el bloqueo de ronda 3).
  var ECEPT_LOADER_FAILSAFE = null;
  var loaderDismissed = false;
  function dismiss() {
    if (loaderDismissed) return;
    loaderDismissed = true;
    window._ECEPT_LOADED = true;
    if (ECEPT_LOADER_FAILSAFE) { clearTimeout(ECEPT_LOADER_FAILSAFE); ECEPT_LOADER_FAILSAFE = null; }
    var l = document.getElementById('initial-loader');
    if (!l) return;
    l.classList.add('go');
    setTimeout(function(){ if(l && l.parentNode) l.parentNode.removeChild(l); }, 1700);
  }
  window.addEventListener('ECEPT_READY', dismiss);
  // Fail-safe: 12s sin ECEPT_READY → mostrar error de carga + lista de _ECEPT_ERRS para diagnóstico.
  ECEPT_LOADER_FAILSAFE = setTimeout(function(){
    if (loaderDismissed || window._ECEPT_LOADED) return;
    var l = document.getElementById('initial-loader');
    if (!l) return;
    if (l.classList.contains('go')) return;
    var errs = window._ECEPT_ERRS || [];
    var errSummary = errs.length
      ? '<div style="font-size:11px;color:#fca5a5;text-align:left;max-width:600px;margin:16px auto 0;font-family:monospace;background:rgba(239,68,68,0.10);padding:12px;border-radius:8px;max-height:200px;overflow:auto;border:1px solid rgba(239,68,68,0.25);">' + errs.slice(-6).map(function(s){ return String(s).replace(/[<>&]/g, function(c){return c==='<'?'&lt;':c==='>'?'&gt;':'&amp;';}); }).join('<br>') + '</div>'
      : '';
    l.innerHTML = '<div style="text-align:center;padding:32px;max-width:700px;font-family:-apple-system,system-ui,sans-serif;"><div style="font-size:36px;margin-bottom:16px;">⚠️</div><div style="font-size:18px;color:#e2e8f0;margin-bottom:8px;font-weight:600;">No pudimos cargar la app</div><div style="font-size:14px;color:#94a3b8;margin-bottom:20px;">Verificá tu conexión a internet</div>' + errSummary + '<button onclick="window.location.reload()" style="margin-top:16px;background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;border:none;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Reintentar</button></div>';
  }, 12000);
})();
</script>
