<script>
  window.addEventListener('ECEPT_READY', function() {
    var l = document.getElementById('initial-loader');
    if (l) {
      l.style.opacity = '0';
      setTimeout(function(){ if (l && l.parentNode) l.parentNode.removeChild(l); }, 280);
    }
  });
  window.addEventListener('error', function(ev) {
    var l = document.getElementById('initial-loader');
    if (!l) return;
    setTimeout(function() {
      var still = document.getElementById('initial-loader');
      if (still) {
        still.innerHTML = '<div style="text-align:center;font-family:Inter,sans-serif;color:#e2e8f0;padding:24px;"><div style="font-size:18px;font-weight:600;margin-bottom:8px;">Algo falló al cargar</div><div style="font-size:13px;color:#94a3b8;margin-bottom:20px;max-width:320px;">Intentá recargar la página. Si persiste, verificá tu conexión.</div><button onclick="window.location.reload()" style="background:linear-gradient(135deg,#60a5fa,#a78bfa);color:white;border:none;padding:10px 24px;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;">Recargar</button></div>';
      }
    }, 50);
  });
</script>
