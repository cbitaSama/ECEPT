<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECEPT — Mapa de Pares Craneales</title>
<style>
  body { margin:0; background:#060a14; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; padding:16px; }
</style>
</head>
<body>

<!-- ═══ COPY FROM HERE TO PASTE INTO REACT VIEW ═══ -->
<div id="ecept-cranial-map">
<style>
  #ecept-cranial-map * { box-sizing:border-box; }
  #ecept-cranial-map {
    background:#0d1224;
    border:1px solid #1a2040;
    border-radius:16px;
    padding:16px;
    color:#e2e8f0;
    font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #ecept-cranial-map .ecm-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px; flex-wrap:wrap; gap:8px;
  }
  #ecept-cranial-map .ecm-title {
    font-size:18px; font-weight:600; color:#e2e8f0; margin:0;
  }
  #ecept-cranial-map .ecm-subtitle {
    font-size:13px; color:#94a3b8; margin:4px 0 0 0;
  }
  #ecept-cranial-map .ecm-legend {
    display:flex; gap:10px; flex-wrap:wrap;
  }
  #ecept-cranial-map .ecm-legend-item {
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:#94a3b8;
  }
  #ecept-cranial-map .ecm-dot {
    width:10px; height:10px; border-radius:50%;
  }
  #ecept-cranial-map .ecm-svg-wrap {
    width:100%; background:radial-gradient(ellipse at center, #0a1020 0%, #060a14 100%);
    border-radius:12px;
    border:1px solid #1a2040; overflow:hidden;
    touch-action:manipulation;
  }
  #ecept-cranial-map svg { display:block; width:100%; height:auto; }
  #ecept-cranial-map .ecm-nerve-line {
    cursor:pointer; transition:stroke-width 0.18s, opacity 0.18s, filter 0.18s;
    stroke-linecap:round; stroke-linejoin:round;
  }
  #ecept-cranial-map .ecm-nerve-hit {
    cursor:pointer; fill:transparent; stroke:transparent;
  }
  #ecept-cranial-map .ecm-label {
    cursor:pointer; font-family:'DM Sans', sans-serif;
    font-size:13px; font-weight:600;
    user-select:none; -webkit-user-select:none;
    transition:font-size 0.18s, opacity 0.18s;
  }
  #ecept-cranial-map .ecm-label-bg {
    cursor:pointer; transition:opacity 0.18s, stroke-width 0.18s;
  }
  #ecept-cranial-map .ecm-leader {
    transition:opacity 0.18s, stroke-width 0.18s;
    pointer-events:none;
  }
  #ecept-cranial-map .ecm-nerve-line.dim,
  #ecept-cranial-map .ecm-label.dim,
  #ecept-cranial-map .ecm-label-bg.dim,
  #ecept-cranial-map .ecm-leader.dim { opacity:0.18; }
  #ecept-cranial-map .ecm-nerve-line.active {
    stroke-width:5;
    filter:drop-shadow(0 0 6px currentColor);
  }
  #ecept-cranial-map .ecm-label.active { font-size:15px; }
  #ecept-cranial-map .ecm-label-bg.active { stroke-width:2; }
  #ecept-cranial-map .ecm-leader.active { stroke-width:1.5; opacity:1; }
  #ecept-cranial-map .ecm-region-label {
    fill:#e2e8f0;
    font-family:'DM Sans', sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.4px;
    pointer-events:none;
    paint-order:stroke;
    stroke:#060a14;
    stroke-width:3;
    stroke-linejoin:round;
  }
  #ecept-cranial-map .ecm-region-label-sm {
    fill:#cbd5e1;
    font-family:'DM Sans', sans-serif;
    font-size:9px;
    font-weight:500;
    font-style:italic;
    letter-spacing:0.3px;
    pointer-events:none;
    paint-order:stroke;
    stroke:#060a14;
    stroke-width:2.5;
    stroke-linejoin:round;
  }
  #ecept-cranial-map .ecm-region-leader {
    stroke:#94a3b8;
    stroke-width:0.8;
    fill:none;
    opacity:0.7;
    pointer-events:none;
  }
  #ecept-cranial-map .ecm-panel {
    margin-top:14px; background:#060a14;
    border:1px solid #1a2040; border-radius:12px;
    padding:16px; animation:ecmFade 0.2s ease;
  }
  @keyframes ecmFade {
    from { opacity:0; transform:translateY(-4px); }
    to { opacity:1; transform:translateY(0); }
  }
  #ecept-cranial-map .ecm-panel-head {
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px; margin-bottom:12px;
  }
  #ecept-cranial-map .ecm-panel-name {
    font-size:18px; font-weight:700; margin:0; color:#e2e8f0;
  }
  #ecept-cranial-map .ecm-panel-roman {
    display:inline-block; font-size:13px; font-weight:700;
    padding:2px 8px; border-radius:6px;
    background:rgba(59,130,246,0.15); color:#60a5fa;
    margin-right:8px;
  }
  #ecept-cranial-map .ecm-panel-type {
    display:inline-block; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.5px;
    margin-top:6px;
  }
  #ecept-cranial-map .ecm-close {
    background:#1a2040; border:none; color:#e2e8f0;
    width:36px; height:36px; border-radius:8px;
    font-size:18px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  #ecept-cranial-map .ecm-close:active { background:#2a3050; }
  #ecept-cranial-map .ecm-row {
    display:grid; grid-template-columns:120px 1fr;
    gap:10px; padding:8px 0;
    border-top:1px solid #1a2040;
    font-size:13px;
  }
  #ecept-cranial-map .ecm-row:first-of-type { border-top:none; }
  #ecept-cranial-map .ecm-row-label {
    color:#64748b; font-weight:600; font-size:11px;
    text-transform:uppercase; letter-spacing:0.5px;
    padding-top:2px;
  }
  #ecept-cranial-map .ecm-row-value { color:#e2e8f0; line-height:1.5; }
  #ecept-cranial-map .ecm-function {
    margin-top:10px; padding:10px 12px;
    background:rgba(59,130,246,0.08);
    border-left:3px solid #3b82f6;
    border-radius:6px; font-size:13px; color:#e2e8f0; line-height:1.5;
  }
  #ecept-cranial-map .ecm-function strong { color:#60a5fa; }
  #ecept-cranial-map .ecm-hint {
    text-align:center; font-size:12px; color:#64748b;
    margin-top:10px; font-style:italic;
  }
  @media (max-width:520px) {
    #ecept-cranial-map .ecm-row { grid-template-columns:1fr; gap:2px; }
    #ecept-cranial-map .ecm-label { font-size:11px; }
  }
</style>

<div class="ecm-header">
  <div>
    <h3 class="ecm-title">🧠 Mapa interactivo — Pares craneales</h3>
    <p class="ecm-subtitle">Vista inferior del encéfalo. Toca un nervio para ver detalles.</p>
  </div>
  <div class="ecm-legend">
    <div class="ecm-legend-item"><span class="ecm-dot" style="background:#60a5fa"></span>Motor</div>
    <div class="ecm-legend-item"><span class="ecm-dot" style="background:#34d399"></span>Sensitivo</div>
    <div class="ecm-legend-item"><span class="ecm-dot" style="background:#a78bfa"></span>Mixto</div>
  </div>
</div>

<div class="ecm-svg-wrap">

      <stop offset="100%" stop-color="#3a2e1d"/>
    </radialGradient>
    <radialGradient id="ecmHighlight" cx="50%" cy="50%" r="50%">

      <stop offset="100%" stop-color="#2a1010"/>
    </radialGradient>

    <filter id="ecmSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ecmEyeShadow" x="-30%" y="-30%" width="160%" height="160%">

      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

      trajectory:"Los axones atraviesan la lámina cribosa del etmoides y hacen sinapsis en el bulbo olfatorio. De ahí parten las cintillas olfatorias hacia la corteza piriforme.",
      func:"Olfato. Único par craneal cuyas fibras NO hacen sinapsis en el tálamo antes de llegar a la corteza."},
    "II":{name:"Óptico",roman:"II",type:"Sensitivo",color:"#34d399",
      apparent:"Quiasma óptico (cara inferior del diencéfalo)",
      real:"Células ganglionares de la retina",
      trajectory:"Las fibras nasales se decusan en el quiasma; las temporales no. Forman las cintillas ópticas → cuerpo geniculado lateral → radiaciones ópticas → corteza visual occipital.",
      func:"Visión. Técnicamente es una prolongación del SNC (envuelto por meninges, no es un nervio periférico verdadero)."},
    "III":{name:"Motor ocular común (Oculomotor)",roman:"III",type:"Motor",color:"#60a5fa",
      apparent:"Surco interpeduncular (mesencéfalo, fosa interpeduncular)",
      real:"Núcleo del III par y núcleo de Edinger-Westphal (mesencéfalo, a nivel del colículo superior)",
      trajectory:"Sale por la fosa interpeduncular, atraviesa el seno cavernoso y entra a la órbita por la hendidura esfenoidal. Inerva 4 músculos extraoculares + elevador del párpado + parasimpático pupilar.",
      func:"Movimiento ocular: recto superior, recto inferior, recto medial, oblicuo inferior. Eleva el párpado (elevador del párpado superior). Constricción pupilar y acomodación (parasimpático)."},
    "IV":{name:"Troclear (Patético)",roman:"IV",type:"Motor",color:"#60a5fa",
      apparent:"Cara dorsal del mesencéfalo (único par que emerge dorsalmente)",
      real:"Núcleo del IV par (mesencéfalo, colículo inferior)",
      trajectory:"Es el nervio más delgado y el de trayecto intracraneal más largo. Decusa antes de salir, rodea el pedúnculo cerebral y entra a la órbita por la hendidura esfenoidal. Inerva al oblicuo superior.",
      func:"Movimiento ocular: solamente el músculo oblicuo superior, que mueve el ojo hacia abajo y adentro (intorsión)."},
    "V":{name:"Trigémino",roman:"V",type:"Mixto",color:"#a78bfa",
      apparent:"Cara anterolateral de la protuberancia",
      real:"Núcleos sensitivos (mesencefálico, principal, espinal) y núcleo motor del V (puente)",
      trajectory:"Tiene 3 ramas: V1 oftálmica (hendidura esfenoidal), V2 maxilar (foramen redondo) y V3 mandibular (foramen oval). Sensibilidad de la cara y motor de los músculos de la masticación.",
      func:"Sensibilidad de toda la cara, cuero cabelludo anterior, córnea, mucosa oral y nasal, 2/3 anteriores de la lengua (tacto, no gusto). Motor: músculos de la masticación (masetero, temporal, pterigoideos)."},
    "VI":{name:"Motor ocular externo (Abducens)",roman:"VI",type:"Motor",color:"#60a5fa",
      apparent:"Surco bulboprotuberancial (medial)",
      real:"Núcleo del VI par (puente, piso del IV ventrículo)",
      trajectory:"Tiene el trayecto intracraneal más largo después del IV. Atraviesa el seno cavernoso y entra a la órbita por la hendidura esfenoidal. Inerva al recto lateral.",
      func:"Movimiento ocular: solamente el músculo recto lateral, encargado de la abducción del ojo (mirada hacia afuera)."},
    "VII":{name:"Facial",roman:"VII",type:"Mixto",color:"#a78bfa",
      apparent:"Surco bulboprotuberancial (lateral, junto al VIII)",
      real:"Núcleo motor del VII (puente), núcleo salival superior, núcleo solitario",
      trajectory:"Sale por el ángulo pontocerebeloso, entra al conducto auditivo interno con el VIII, recorre el conducto facial del peñasco y emerge por el agujero estilomastoideo. Inerva mímica facial + gusto 2/3 anteriores de lengua + glándulas salivales y lagrimal.",
      func:"Motor: músculos de la mímica facial. Sensitivo: gusto en 2/3 anteriores de la lengua. Parasimpático: glándulas submandibular, sublingual y lagrimal. También inerva el músculo del estribo (estapedio)."},
    "VIII":{name:"Vestibulococlear (Estatoacústico)",roman:"VIII",type:"Sensitivo",color:"#34d399",
      apparent:"Surco bulboprotuberancial (lateral, ángulo pontocerebeloso)",
      real:"Ganglio espiral de Corti (coclear) y ganglio de Scarpa (vestibular)",
      trajectory:"Tiene 2 ramas: coclear (audición) y vestibular (equilibrio). Entra al conducto auditivo interno junto al VII. Núcleos en el puente y bulbo.",
      func:"Audición (rama coclear). Equilibrio, posición y movimiento de la cabeza en el espacio (rama vestibular, desde utrículo, sáculo y conductos semicirculares)."},
    "IX":{name:"Glosofaríngeo",roman:"IX",type:"Mixto",color:"#a78bfa",
      apparent:"Surco colateral posterior del bulbo (por encima del X)",
      real:"Núcleo ambiguo, núcleo solitario, núcleo salival inferior (bulbo)",
      trajectory:"Sale por el agujero yugular junto al X y XI. Sensibilidad del 1/3 posterior de lengua + gusto, motor del estilofaríngeo, parasimpático para parótida, sensibilidad de orofaringe (reflejo nauseoso aferente).",
      func:"Sensibilidad y gusto del 1/3 posterior de la lengua, sensibilidad de la orofaringe (aferencia del reflejo nauseoso), motor del estilofaríngeo (deglución), parasimpático de la glándula parótida. Aferencia del seno carotídeo (barorreflejo)."},
    "X":{name:"Vago (Neumogástrico)",roman:"X",type:"Mixto",color:"#a78bfa",
      apparent:"Surco colateral posterior del bulbo (debajo del IX)",
      real:"Núcleo ambiguo, núcleo dorsal del vago, núcleo solitario",
      trajectory:"Sale por el agujero yugular. Es el par de mayor distribución: inerva paladar blando, faringe, laringe, y da inervación parasimpática a tórax y abdomen hasta el ángulo esplénico del colon.",
      func:"Motor del paladar blando, faringe y laringe (fonación, deglución). Parasimpático de tórax (corazón, pulmón) y abdomen hasta el ángulo esplénico del colon. Sensibilidad visceral. Eferencia del reflejo nauseoso."},
    "XI":{name:"Accesorio (Espinal)",roman:"XI",type:"Motor",color:"#60a5fa",
      apparent:"Cara lateral de la médula cervical alta (raíces espinales C1-C5) y bulbo (raíces craneales)",
      real:"Núcleo espinal (asta anterior C1-C5) y núcleo ambiguo (raíz craneal)",
      trajectory:"Las raíces espinales ascienden por el agujero magno, se unen a las craneales, y todas salen por el agujero yugular. Inerva esternocleidomastoideo (ECM) y trapecio.",
      func:"Motor del esternocleidomastoideo (rotación de la cabeza al lado contrario) y del trapecio (elevación del hombro y rotación de la escápula)."},
    "XII":{name:"Hipogloso",roman:"XII",type:"Motor",color:"#60a5fa",
      apparent:"Surco preolivar del bulbo (entre pirámide y oliva)",
      real:"Núcleo del hipogloso (bulbo, piso del IV ventrículo)",
      trajectory:"Sale por el conducto del hipogloso (canal condíleo anterior). Inerva toda la musculatura intrínseca y extrínseca de la lengua (excepto el palatogloso, inervado por el X).",
      func:"Motor de toda la musculatura de la lengua, intrínseca y extrínseca (excepto el palatogloso, que es del X). Esencial para el habla, la masticación y la deglución."}
  };

  var TYPE_BG = {
    "Motor":"rgba(96,165,250,0.15)",
    "Sensitivo":"rgba(52,211,153,0.15)",
    "Mixto":"rgba(167,139,250,0.15)"
  };

  var root = document.getElementById('ecept-cranial-map');
  var mount = document.getElementById('ecm-panel-mount');
  var activeId = null;

  function getNerveGroups(){
    return root.querySelectorAll('.ecm-nerve');
  }

  function clearActive(){
    activeId = null;
    var groups = getNerveGroups();
    for (var i=0; i<groups.length; i++){
      var g = groups[i];
      var lines = g.querySelectorAll('.ecm-nerve-line');
      var labels = g.querySelectorAll('.ecm-label, .ecm-label-bg, .ecm-leader');
      for (var j=0; j<lines.length; j++){
        lines[j].classList.remove('dim');
        lines[j].classList.remove('active');
      }
      for (var k=0; k<labels.length; k++){
        labels[k].classList.remove('dim');
        labels[k].classList.remove('active');
      }
    }
    mount.innerHTML = '';
  }

  function setActive(id){
    if (activeId === id){
      clearActive();
      return;
    }
    activeId = id;
    var groups = getNerveGroups();
    for (var i=0; i<groups.length; i++){
      var g = groups[i];
      var isActive = g.getAttribute('data-nerve') === id;
      var lines = g.querySelectorAll('.ecm-nerve-line');
      var labels = g.querySelectorAll('.ecm-label, .ecm-label-bg, .ecm-leader');
      for (var j=0; j<lines.length; j++){
        if (isActive){
          lines[j].classList.add('active');
          lines[j].classList.remove('dim');
        } else {
          lines[j].classList.add('dim');
          lines[j].classList.remove('active');
        }
      }
      for (var k=0; k<labels.length; k++){
        if (isActive){
          labels[k].classList.add('active');
          labels[k].classList.remove('dim');
        } else {
          labels[k].classList.add('dim');
          labels[k].classList.remove('active');
        }
      }
    }
    renderPanel(id);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  function renderPanel(id){
    var n = NERVES[id];
    if (!n) return;
    var html = '' +
      '<div class="ecm-panel" role="region" aria-label="Detalle del nervio">' +
        '<div class="ecm-panel-head">' +
          '<div>' +
            '<h4 class="ecm-panel-name">' +
              '<span class="ecm-panel-roman" style="background:' + n.color + '22;color:' + n.color + '">' + n.roman + '</span>' +
              escapeHtml(n.name) +
            '</h4>' +
            '<span class="ecm-panel-type" style="background:' + TYPE_BG[n.type] + ';color:' + n.color + '">' + n.type + '</span>' +
          '</div>' +
          '<button class="ecm-close" aria-label="Cerrar" type="button">×</button>' +
        '</div>' +
        '<div class="ecm-row"><div class="ecm-row-label">Origen aparente</div><div class="ecm-row-value">' + escapeHtml(n.apparent) + '</div></div>' +
        '<div class="ecm-row"><div class="ecm-row-label">Origen real</div><div class="ecm-row-value">' + escapeHtml(n.real) + '</div></div>' +
        '<div class="ecm-row"><div class="ecm-row-label">Trayecto</div><div class="ecm-row-value">' + escapeHtml(n.trajectory) + '</div></div>' +
        '<div class="ecm-function"><strong>⚡ Función:</strong> ' + escapeHtml(n.func) + '</div>' +
      '</div>';
    mount.innerHTML = html;
    var btn = mount.querySelector('.ecm-close');
    if (btn) btn.addEventListener('click', clearActive);
    try { mount.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(e){}
  }

  function attachHandlers(){
    var groups = getNerveGroups();
    for (var i=0; i<groups.length; i++){
      (function(g){
        var id = g.getAttribute('data-nerve');
        g.addEventListener('click', function(){ setActive(id); });
        g.addEventListener('touchstart', function(e){}, {passive:true});
      })(groups[i]);
    }
  }

  attachHandlers();
})();
</script>
</div>
